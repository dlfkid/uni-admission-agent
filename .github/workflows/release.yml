name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (for build script)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Build Extension Artifact
        run: |
          uv run python scripts/build_dist.py --extension-only

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/release/uni-admission-extension-*.zip

  build-backend:
    name: Build Backend on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv
    
      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Backend Artifact  
        run: |
          uv run python scripts/build_dist.py --backend-only

      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: |
            dist/release/adm-agent-*-windows-*.zip
            dist/release/adm-agent-*-macos-*.tar.gz
            dist/release/adm-agent-*-linux-*.tar.gz

  build-client:
    name: Build Client on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv
    
      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Client Artifact
        run: |
          uv run python scripts/build_dist.py --client-only

      - name: Upload Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.os }}
          path: |
            dist/release/adm-agent-client-*-windows-*.zip
            dist/release/adm-agent-client-*-macos-*.tar.gz
            dist/release/adm-agent-client-*-linux-*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-extension, build-backend, build-client]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension
          path: artifacts/

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: artifacts/
          merge-multiple: true

      - name: Download Client Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: artifacts/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
