name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        run: |
          pip install uv
    
      - name: Install dependencies
        run: |
          uv sync --frozen
          # Install pyinstaller explicitly if not in pyproject.toml dev dependencies (it is in dev group)
          # uv run ensures we use the venv

      - name: Build Frontend
        shell: bash
        run: |
          cd extension
          npm ci
          npm run build
          if [ "${{ runner.os }}" == "Windows" ]; then
            powershell Compress-Archive -Path dist/* -DestinationPath uni-admission-extension.zip
          else
            cd dist && zip -r ../uni-admission-extension.zip . && cd ..
          fi

      - name: Build Backend & Assemble
        shell: bash
        run: |
          # Run build script
          # The script now automatically detects OS/Arch and creates named artifacts in dist/release/
          uv run python scripts/build_dist.py --skip-frontend-build

      - name: Handle Permissions (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          # The tar.gz is already created with permissions by the script, but just in case we need to verify?
          # Actually, the script creates the tar.gz. We don't need to chmod the artifact itself usually.
          # But if we want to be safe about the intermediate binary, that's done inside the script before tar-ing?
          # The script uses tarfile which preserves permissions if added correctly.
          # If this step was trying to chmod the 'release/' folder content before upload, 
          # but now we upload archives. So this step might be redundant or just a check.
          # Let's remove it or just echo.
          echo "Permissions handled by build script via tarfile."

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
