name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (for build script)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Build Extension Artifact
        run: |
          uv run python scripts/build_dist.py --extension-only

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/release/uni-admission-extension-*.zip

  build-backend:
    name: Build Backend on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv
    
      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Backend Artifact  
        run: |
          uv run python scripts/build_dist.py --backend-only

      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: |
            dist/release/adm-agent-*-windows-*.zip
            dist/release/adm-agent-*-macos-*.tar.gz
            dist/release/adm-agent-*-linux-*.tar.gz

  build-client:
    name: Build Client on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv
    
      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Client Artifact
        run: |
          uv run python scripts/build_dist.py --client-only

      - name: Upload Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.os }}
          path: |
            dist/release/adm-agent-client-*-windows-*.zip
            dist/release/adm-agent-client-*-macos-*.tar.gz
            dist/release/adm-agent-client-*-linux-*.tar.gz

  upgrade-verify:
    name: Verify upgrade on ${{ matrix.os }}
    needs: [build-backend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # verify_upgrade.py imports src.services.upgrade.layout so the gate
        # exercises the same _CMD_SHIM / InstallLayout code the CLI ships —
        # that needs the project's own editable install, hence uv sync
        # rather than a bare interpreter.
        run: uv sync --frozen

      - name: Download the backend artifact built for this platform
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: artifacts/

      - name: Resolve the currently published release (spec §11 step 2)
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release for THIS tag is published by the `release` job, which
          # runs after this one — so /releases/latest is still the previous
          # real release a user would be upgrading from.
          ARTIFACT=$(ls artifacts/adm-agent-v* | head -1)
          BASENAME=$(basename "$ARTIFACT")
          # Reuse this platform's own suffix so the asset name can never drift
          # from what the build job just produced.
          SUFFIX=$(echo "$BASENAME" | sed -E 's/^adm-agent-.+-((windows|macos|linux)-[^-]+\.(zip|tar\.gz))$/\1/')

          TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "SKIP: no previously published release exists — skipping the previous-real-release leg (spec §11 step 2)"
            exit 0
          fi

          mkdir -p previous
          ASSET="adm-agent-${TAG}-${SUFFIX}"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
               --pattern "$ASSET" --dir previous --clobber; then
            echo "Previous published release: $TAG ($ASSET)"
            echo "artifact=previous/$ASSET" >> "$GITHUB_OUTPUT"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "SKIP: release $TAG publishes no $ASSET — skipping the previous-real-release leg (spec §11 step 2)"
          fi

      - name: Verify upgrade and rollback end to end
        shell: bash
        run: |
          ARTIFACT=$(ls artifacts/adm-agent-v* | head -1)
          # The version MUST come from the artifact filename, not GITHUB_REF_NAME:
          # find_release_asset builds the expected filename from the release tag,
          # so a mismatch makes the asset lookup fail rather than testing anything.
          # Anchor on the known "-{os}-{arch}.{ext}" suffix rather than the
          # first hyphen: this repo has tags like v0.7.5-alpha and a future
          # v1.0.0-rc1 is expected, and the version itself may contain
          # hyphens that a "stop at the first one" pattern would truncate.
          BASENAME=$(basename "$ARTIFACT")
          NEW_VERSION=$(echo "$BASENAME" | sed -E 's/^adm-agent-(.+)-(windows|macos|linux)-[^-]+\.(zip|tar\.gz)$/\1/')
          echo "Verifying $BASENAME as $NEW_VERSION"

          PREVIOUS_ARGS=""
          if [ -n "${{ steps.previous.outputs.artifact }}" ]; then
            PREVIOUS_ARGS="--previous-artifact ${{ steps.previous.outputs.artifact }} --previous-version ${{ steps.previous.outputs.version }}"
          fi

          uv run python scripts/verify_upgrade.py \
            --artifact "$ARTIFACT" \
            --new-version "$NEW_VERSION" \
            --workdir "${RUNNER_TEMP}/upgrade-verify" \
            $PREVIOUS_ARGS

  release:
    name: Create GitHub Release
    needs: [build-extension, build-backend, build-client, upgrade-verify]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension
          path: artifacts/

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: artifacts/
          merge-multiple: true

      - name: Download Client Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
