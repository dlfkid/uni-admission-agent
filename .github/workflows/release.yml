name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (for build script)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Build Extension Artifact
        run: |
          uv run python scripts/build_dist.py --extension-only

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/release/uni-admission-extension-*.zip

  build-backend:
    name: Build Backend on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv
    
      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Backend Artifact  
        run: |
          uv run python scripts/build_dist.py --backend-only

      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: |
            dist/release/adm-agent-*-windows-*.zip
            dist/release/adm-agent-*-macos-*.tar.gz
            dist/release/adm-agent-*-linux-*.tar.gz

  build-client:
    name: Build Client on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv
    
      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Client Artifact
        run: |
          uv run python scripts/build_dist.py --client-only

      - name: Upload Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.os }}
          path: |
            dist/release/adm-agent-client-*-windows-*.zip
            dist/release/adm-agent-client-*-macos-*.tar.gz
            dist/release/adm-agent-client-*-linux-*.tar.gz

  upgrade-verify:
    name: Verify upgrade on ${{ matrix.os }}
    needs: [build-backend, build-client]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # verify_upgrade.py imports src.services.upgrade.layout so the gate
        # exercises the same _CMD_SHIM / InstallLayout code the CLI ships —
        # that needs the project's own editable install, hence uv sync
        # rather than a bare interpreter.
        run: uv sync --frozen

      - name: Download both artifacts built for this platform
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ matrix.os }}"
          path: artifacts/
          merge-multiple: true

      - name: Verify upgrade and rollback end to end for both artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Spec §2 requires full parity for BOTH packaged artifacts. The
          # client ships the same upgrade machinery and was pinned by the same
          # version-comparison defect, so publishing it unverified would leave
          # exactly the hole this gate exists to close.
          for NAME in adm-agent adm-agent-client; do
            echo "::group::${NAME}"
            ARTIFACT=$(ls artifacts/${NAME}-v* 2>/dev/null | head -1)
            if [ -z "$ARTIFACT" ]; then
              echo "FAIL: no ${NAME} artifact was built for this platform"
              exit 1
            fi
            BASENAME=$(basename "$ARTIFACT")

            # The version MUST come from the artifact filename, not
            # GITHUB_REF_NAME: find_release_asset builds the expected filename
            # from the release tag, so a mismatch makes the asset lookup fail
            # rather than testing anything. Anchor on the known
            # "-{os}-{arch}.{ext}" suffix rather than the first hyphen — this
            # repo has tags like v0.7.5-alpha and a future v1.0.0-rc1 is
            # expected, and a "stop at the first hyphen" pattern truncates them.
            NEW_VERSION=$(echo "$BASENAME" | sed -E "s/^${NAME}-(.+)-(windows|macos|linux)-[^-]+\.(zip|tar\.gz)$/\1/")
            SUFFIX=$(echo "$BASENAME" | sed -E "s/^${NAME}-.+-((windows|macos|linux)-[^-]+\.(zip|tar\.gz))$/\1/")
            echo "Verifying $BASENAME as $NEW_VERSION"

            # The release for THIS tag is published by the `release` job, which
            # runs after this one — so /releases/latest is still the previous
            # real release a user would be upgrading from (spec §11 step 2).
            PREVIOUS_ARGS=""
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "SKIP: no previously published release exists — skipping the previous-real-release leg for ${NAME}"
            else
              mkdir -p "previous-${NAME}"
              ASSET="${NAME}-${TAG}-${SUFFIX}"
              if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                   --pattern "$ASSET" --dir "previous-${NAME}" --clobber; then
                echo "Previous published release: $TAG ($ASSET)"
                PREVIOUS_ARGS="--previous-artifact previous-${NAME}/${ASSET} --previous-version ${TAG}"
              else
                echo "SKIP: release $TAG publishes no $ASSET — skipping the previous-real-release leg for ${NAME}"
              fi
            fi

            uv run python scripts/verify_upgrade.py \
              --artifact "$ARTIFACT" \
              --artifact-name "$NAME" \
              --new-version "$NEW_VERSION" \
              --workdir "${RUNNER_TEMP}/upgrade-verify-${NAME}" \
              $PREVIOUS_ARGS || exit 1
            echo "::endgroup::"
          done

  release:
    name: Create GitHub Release
    needs: [build-extension, build-backend, build-client, upgrade-verify]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension
          path: artifacts/

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-*
          path: artifacts/
          merge-multiple: true

      - name: Download Client Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
