[project]
name = "uni-admission-agent"
version = "0.9.0"
description = "Automated university admission requirements scraper using LLM and stealth browsing"
authors = [
    { name = "Rayne Deng", email = "rayne.deng@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

keywords = ["scraper", "university", "admission", "llm", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "crawl4ai>=0.2.0",
    "playwright-stealth>=2.0.1",
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.11",
    "pandas>=3.0.0",
    "openpyxl>=3.1.5",
    "sqlalchemy-utils>=0.42.1",
    "python-dateutil>=2.9.0.post0",
    "google-genai>=1.62.0",
    "openai>=2.18.0",
    "pymupdf4llm>=0.2.9",
    "volcengine-python-sdk[ark]>=5.0.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "typer>=0.15.0",
    "mcp[cli]>=1.9.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
uni-admission = "src.cmd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -m 'not integration'"
markers = [
    "integration: requires external services (DB, LLM, network)",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked:DeprecationWarning",
    "ignore:builtin type SwigPyObject:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.4.0",
    "pyinstaller>=6.19.0",
    "pylint>=4.0.5",
    "pyright>=1.1.408",
    "ruff>=0.15.0",
]

# Single-source version bumping: one command updates every version location,
# commits, and tags — no hand-editing. See RELEASING.md.
#   uv run bump-my-version bump patch|minor|major
[tool.bumpversion]
current_version = "0.9.0"
allow_dirty = false
commit = true
message = "chore: release v{new_version} (was v{current_version})"
tag = true
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"

# Source-of-truth files — precise search so unrelated numbers are never touched.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "src/api/server.py"
search = "version=\"{current_version}\""
replace = "version=\"{new_version}\""

# JSON manifests — match the "version" field only.
[[tool.bumpversion.files]]
filename = ".claude-plugin/plugin.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = ".claude-plugin/marketplace.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = "frontend/package.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = "frontend/public/manifest.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

# Lockfile root version. Only the two root entries equal the project version
# (deps carry their own, different versions), so a "version" field match is safe.
[[tool.bumpversion.files]]
filename = "frontend/package-lock.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

# uv.lock records this project's own version in its [[package]] entry. Unlike
# the files above, a bare version match here is NOT safe: dependencies live in
# the same file and one can coincidentally share our version number (at 0.9.0,
# `tabulate` did exactly that). Anchor on the package name so only our own
# entry can ever match. Without this block uv.lock drifts stale, and since
# `uv run` re-syncs it on the fly, every later invocation dirties the working
# tree — which then blocks the next `bump` (allow_dirty = false).
[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"uni-admission-agent\"\nversion = \"{current_version}\""
replace = "name = \"uni-admission-agent\"\nversion = \"{new_version}\""

[tool.pylint.messages_control]
disable = [
    "C0302", # Too many lines in module
    "C0114", "C0115", "C0116", # Missing docstrings
    "C0301", "C0303", "C0305", "C0321", "C0325", "C0411", "C0413", "C0415", # Formatting/Imports
    "C0103", "C1803", # Naming/Conventions
    "E0401", "E1133", "E0203", "E1101", "E1102", "E1111", # False positive Errors
    "R0902", "R0903", "R0912", "R0913", "R0914", "R0915", "R0917", "R1705", "R0801", "R1732", # Refactoring
    "W0107", "W0311", "W0611", "W0622", "W0702", "W0707", "W0718", "W1203", "W1309", "W1510", # Warnings
    "W0201", "W0212", "W0404", "W0612", "W0613", "W0621", "W1201", "W2301" # More Warnings
]

[tool.pylint.format]
max-line-length = 120
