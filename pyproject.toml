[project]
name = "uni-admission-agent"
version = "0.1.0"
description = "Automated university admission requirements scraper using LLM and stealth browsing"
authors = [
    { name = "Rayne Deng", email = "rayne.deng@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

keywords = ["scraper", "university", "admission", "llm", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "crawl4ai>=0.2.0",
    "playwright-stealth>=2.0.1",
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.11",
    "pandas>=3.0.0",
    "openpyxl>=3.1.5",
    "sqlalchemy-utils>=0.42.1",
    "python-dateutil>=2.9.0.post0",
    "google-genai>=1.62.0",
    "openai>=2.18.0",
    "pymupdf4llm>=0.2.9",
    "volcengine-python-sdk[ark]>=5.0.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "typer>=0.15.0",
    "mcp[cli]>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
uni-admission = "src.cmd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -m 'not integration'"
markers = [
    "integration: requires external services (DB, LLM, network)",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked:DeprecationWarning",
    "ignore:builtin type SwigPyObject:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pyright>=1.1.408",
    "ruff>=0.15.0",
]
